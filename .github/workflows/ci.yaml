name: Course Management System CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master
      - feature/**

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CourseManagementSystem

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build backend
        run: dotnet build --no-restore --configuration Release

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cmsfrontend/course-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: cmsfrontend/course-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint 
        run: npm run lint

      - name: Build frontend
        run: npm run build
